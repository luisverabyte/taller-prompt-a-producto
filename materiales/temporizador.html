/* Pantalla única para proyector: cuenta regresiva gigante de la fase actual,
   total restante arriba y una línea de tiempo proporcional de las 6 fases abajo. */
:root {
  --bg: #F8F9FF;
  --fg: #191C20;
  --muted: #44474C;
  --primary: #336699;
  --on-primary: #FFFFFF;
  --container: #D1E4FF;
  --on-container: #001D36;
  --surface2: #ECEEF4;
  --line: #C4C6CC;
  --alert-bg: #FFDBD0;
  --alert-fg: #390B00;
  --alert: #D97757;
  --alert-text: #99462A;
  --sans: "Google Sans Flex", "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --fg: #E1E2E8; --muted: #C4C6CC; --primary: #9ECAFF; --on-primary: #003258;
    --container: #09497A; --on-container: #D1E4FF; --surface2: #1D2024; --line: #44474C;
    --alert-bg: #7A2F15; --alert-fg: #FFDBD0; --alert: #D97757; --alert-text: #FFB59E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --fg: #E1E2E8; --muted: #C4C6CC; --primary: #9ECAFF; --on-primary: #003258;
  --container: #09497A; --on-container: #D1E4FF; --surface2: #1D2024; --line: #44474C;
  --alert-bg: #7A2F15; --alert-fg: #FFDBD0; --alert: #D97757; --alert-text: #FFB59E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  transition: background-color .4s ease, color .4s ease;
}
body[data-alert="warn"] { background: var(--alert-bg); color: var(--alert-fg); }
body[data-alert="end"] { background: var(--alert-bg); color: var(--alert-fg); animation: flash 1s steps(2, jump-none) infinite; }
@keyframes flash { 50% { background: var(--bg); color: var(--fg); } }
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  body[data-alert="end"] { animation: none; }
}

.app { min-height: 100%; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { font-family: var(--mono); font-weight: 800; font-size: 22px; color: var(--primary); }
body[data-alert] .brand { color: inherit; }
.total { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.total b { font-family: var(--mono); font-weight: 800; }

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-width: 0; }
.kicker { font-family: var(--mono); font-weight: 700; font-size: clamp(16px, 2.2vw, 28px); letter-spacing: .04em; color: var(--muted); margin: 0; }
body[data-alert] .kicker { color: inherit; }
h1 { margin: 0; font-weight: 900; letter-spacing: -.02em; line-height: 1; font-size: clamp(34px, 6vw, 88px); text-wrap: balance; }
.clock {
  font-family: var(--mono); font-weight: 800; font-variant-numeric: tabular-nums; line-height: .95;
  font-size: clamp(96px, 26vw, 400px); letter-spacing: -.04em; color: var(--primary);
}
body[data-alert] .clock { color: var(--alert-text); }
.hint { margin: 0; font-size: clamp(20px, 2.6vw, 38px); font-weight: 500; line-height: 1.3; max-width: 38ch; }

.bar { height: 20px; border-radius: 9999px; background: var(--surface2); overflow: hidden; }
body[data-alert] .bar { background: rgba(255, 255, 255, .45); }
.bar > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: inherit; transition: width .25s linear; }
body[data-alert] .bar > i { background: var(--alert); }

.timeline { display: flex; gap: 6px; padding: 0; margin: 0; list-style: none; }
.seg { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.seg .track { height: 14px; border-radius: 9999px; background: var(--surface2); overflow: hidden; }
.seg .track i { display: block; height: 100%; width: 0; background: var(--line); }
.seg.done .track i { width: 100%; background: var(--primary); }
.seg.now .track { outline: 3px solid var(--primary); outline-offset: 2px; }
.seg.now .track i { background: var(--primary); }
.seg .lbl { font-size: 15px; font-weight: 700; color: var(--muted); line-height: 1.2; overflow-wrap: anywhere; }
.seg.now .lbl { color: var(--fg); }
.seg .min { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--muted); }
body[data-alert] .seg .lbl, body[data-alert] .seg .min { color: inherit; }
@media (max-width: 640px) { .seg .lbl { display: none; } }

.controls { display: flex; flex-wrap: wrap; gap: 10px; }
button {
  font: inherit; font-weight: 700; font-size: 17px; cursor: pointer;
  padding: 12px 20px; border-radius: 9999px; border: 2px solid var(--line);
  background: var(--surface2); color: var(--fg);
}
button:hover { border-color: var(--primary); }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
button.main { background: var(--primary); border-color: var(--primary); color: var(--on-primary); min-width: 150px; }
kbd { font-family: var(--mono); font-size: 13px; opacity: .7; margin-left: 6px; }
.keys { margin: 0; font-size: 15px; color: var(--muted); }
body[data-alert] .keys { color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<main class="app">
  <header class="top">
    <div class="brand">&gt; taller_45min</div>
    <div class="total"><b id="totalLeft">45:00</b> restantes de <b>45:00</b></div>
    <div class="controls" role="group" aria-label="Controles del temporizador">
      <button id="btnToggle" class="main" type="button">Iniciar<kbd>espacio</kbd></button>
      <button id="btnPrev" type="button">Fase anterior<kbd>←</kbd></button>
      <button id="btnNext" type="button">Fase siguiente<kbd>→</kbd></button>
      <button id="btnMinus" type="button">−1 min<kbd>-</kbd></button>
      <button id="btnPlus" type="button">+1 min<kbd>+</kbd></button>
      <button id="btnReset" type="button">Reiniciar<kbd>R</kbd></button>
      <button id="btnFull" type="button">Pantalla completa<kbd>F</kbd></button>
    </div>
  </header>

  <section class="stage" aria-label="Fase actual">
    <p class="kicker" id="kicker">FASE 1 DE 6</p>
    <h1 id="phaseName">Bienvenida</h1>
    <div class="clock" id="clock" role="timer" aria-label="Tiempo restante de la fase">04:00</div>
    <p class="hint" id="hint"></p>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </section>

  <ol class="timeline" id="timeline" aria-label="Fases del taller"></ol>
  <p class="keys">Al correr desfasado, usa −1 min / +1 min para que la fase coincida con la sala.</p>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<script>
(function () {
  var PHASES = [
    { name: "Bienvenida", min: 4, hint: "Parejas, QR del repositorio y acceso a Colab." },
    { name: "Demo y arquitectura", min: 6, hint: "Prototipo final y el flujo en un solo diagrama." },
    { name: "Checkpoint 1: primera llamada a la API", min: 10, hint: "API key y primer request. Sticker verde al lograrlo." },
    { name: "Checkpoint 2: del prompt a la lógica", min: 12, hint: "System prompt, salida en JSON, validaciones y micro-reto." },
    { name: "Checkpoint 3: interfaz y compartir", min: 8, hint: "Gradio, link público y el muro compartido." },
    { name: "Showcase y cierre", min: 5, hint: "2 o 3 parejas, 1 minuto cada una, y siguientes pasos." }
  ];
  var MIN = 60000, STORE = "taller-temporizador-v1";
  var t0 = 0;
  PHASES.forEach(function (p) { p.start = t0; p.end = t0 + p.min * MIN; t0 = p.end; });
  var TOTAL = t0;

  var $ = function (id) { return document.getElementById(id); };
  var elapsed = 0, running = false, last = 0, lastPhase = -1, wake = null;

  function fmt(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60);
    return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function phaseAt(ms) {
    for (var i = PHASES.length - 1; i >= 0; i--) if (ms >= PHASES[i].start) return i;
    return 0;
  }

  var tl = $("timeline");
  PHASES.forEach(function (p, i) {
    var li = document.createElement("li");
    li.className = "seg"; li.style.flex = p.min + " 1 0";
    li.innerHTML = '<div class="track"><i></i></div><div class="min"></div><div class="lbl"></div>';
    li.querySelector(".min").textContent = p.min + " min";
    li.querySelector(".lbl").textContent = p.name;
    li.addEventListener("click", function () { jump(p.start); });
    tl.appendChild(li);
  });
  var segs = tl.children;

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ elapsed: elapsed, running: running, at: Date.now() })); } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE) || "null");
      if (d && typeof d.elapsed === "number") {
        elapsed = d.elapsed + (d.running ? Date.now() - d.at : 0);
        elapsed = Math.min(Math.max(elapsed, 0), TOTAL);
        if (d.running && elapsed < TOTAL) start();
      }
    } catch (e) {}
  }

  function render() {
    var i = phaseAt(elapsed), p = PHASES[i], done = elapsed >= TOTAL;
    var left = done ? 0 : p.end - elapsed;
    $("clock").textContent = fmt(left);
    $("totalLeft").textContent = fmt(TOTAL - elapsed);
    $("kicker").textContent = "FASE " + (i + 1) + " DE " + PHASES.length + " · MIN " + (p.start / MIN) + "-" + (p.end / MIN);
    $("phaseName").textContent = done ? "Taller terminado" : p.name;
    $("hint").textContent = done ? "Foto grupal con cada prototipo funcionando." : p.hint;
    $("barFill").style.width = (done ? 100 : ((elapsed - p.start) / (p.end - p.start)) * 100) + "%";
    var alert = done ? "end" : (left <= MIN && running ? "warn" : "");
    if (alert) document.body.setAttribute("data-alert", alert); else document.body.removeAttribute("data-alert");
    for (var k = 0; k < segs.length; k++) {
      var s = PHASES[k], seg = segs[k];
      seg.classList.toggle("done", elapsed >= s.end);
      seg.classList.toggle("now", k === i && !done);
      seg.querySelector(".track i").style.width = k === i && !done ? ((elapsed - s.start) / (s.end - s.start)) * 100 + "%" : "";
    }
    $("btnToggle").firstChild.nodeValue = running ? "Pausar" : (elapsed > 0 && !done ? "Continuar" : "Iniciar");
    document.title = fmt(left) + " · " + (done ? "Taller terminado" : p.name);
    if (i !== lastPhase) { $("live").textContent = done ? "Taller terminado" : "Fase " + (i + 1) + ": " + p.name; lastPhase = i; }
  }

  function tick() {
    if (running) {
      var t = performance.now();
      elapsed += t - last; last = t;
      if (elapsed >= TOTAL) { elapsed = TOTAL; running = false; release(); }
    }
    render();
  }
  function start() {
    if (elapsed >= TOTAL) elapsed = 0;
    running = true; last = performance.now();
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () {}); } catch (e) {}
    render(); save();
  }
  function pause() { running = false; release(); render(); save(); }
  function release() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }
  function jump(ms) { elapsed = Math.min(Math.max(ms, 0), TOTAL); last = performance.now(); render(); save(); }
  function next() { var i = phaseAt(elapsed); jump(i < PHASES.length - 1 ? PHASES[i + 1].start : TOTAL); }
  function prev() { var i = phaseAt(elapsed); jump(elapsed - PHASES[i].start > 3000 ? PHASES[i].start : PHASES[Math.max(i - 1, 0)].start); }
  function reset() { running = false; release(); elapsed = 0; render(); save(); }
  function full() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    } catch (e) {}
  }

  $("btnToggle").addEventListener("click", function () { running ? pause() : start(); });
  $("btnNext").addEventListener("click", next);
  $("btnPrev").addEventListener("click", prev);
  $("btnMinus").addEventListener("click", function () { jump(elapsed - MIN); });
  $("btnPlus").addEventListener("click", function () { jump(elapsed + MIN); });
  $("btnReset").addEventListener("click", reset);
  $("btnFull").addEventListener("click", full);
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === " ") { e.preventDefault(); running ? pause() : start(); }
    else if (k === "ArrowRight") next();
    else if (k === "ArrowLeft") prev();
    else if (k === "+" || k === "=") jump(elapsed + MIN);
    else if (k === "-") jump(elapsed - MIN);
    else if (k === "r" || k === "R") reset();
    else if (k === "f" || k === "F") full();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && running) { try { navigator.wakeLock && navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () {}); } catch (e) {} }
  });

  load();
  render();
  setInterval(tick, 200);
})();
</script>
